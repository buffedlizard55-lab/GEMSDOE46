name: Verify scientific code and downloadable artifact
on:
  pull_request:
  push:
    branches: [main, arena/9d8260a3-gemsdoe46, arena/415e48b4-gemsdoe46, arena/78db1a94-gemsdoe46, arena/945df236-gemsdoe46, arena/4db1b13a-gemsdoe46]
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore hash-pinned inputs required by the tests and by the R11F/R12 experiments
        run: |
          bash scripts/restore_competition_data.sh
          bash scripts/restore_r10_reference.sh
          bash scripts/restore_r12_reference.sh
      - name: Run the test suite
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest.log
      - name: Publish the failing test log on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 pytest.log > pytest_tail.log || true
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --body-file pytest_tail.log || true
      - run: python scripts/verify_all.py
      # build_site.py, build_r10_site.py, build_r11_site.py and build_h47_site.py are historical
      # builders: they write the same three active pages from older receipts. The active site is
      # generated by build_r11f_site.py from registry/r11f.json; build_r12_site.py writes only
      # docs/r12/index.html, so the two gate-passed candidates cannot overwrite each other.
      - name: Rebuild the active site from the current receipt
        run: python scripts/build_r11f_site.py
      - name: Rebuild the R12 candidate page from its receipt
        run: python scripts/build_r12_site.py
      - name: Regenerate the irregularities page from its registry
        run: python scripts/build_irregularities_page.py
      - name: Generated pages are reproducible
        run: git diff --exit-code -- index.html docs/index.html docs/executive-summary.html docs/irregularities.html docs/r12/index.html
      - name: Format audit of the active downloadable candidate
        run: python scripts/verify_r11f_candidate.py
      - name: Every downloadable candidate artifact is present and range-valid
        run: |
          python - <<'PY'
          import json, pathlib, rasterio, numpy as np
          root = pathlib.Path('.')
          # the receipts predate a shared schema: r11/r12 are flat, r11f nests them under `candidate`
          for tag, positive in (('r11', 37654), ('r11f', 44090), ('r12', 37654)):
              r = json.loads((root / 'registry' / f'{tag}.json').read_text())
              a_rec = r.get('audit', r.get('candidate', {}))
              name = r.get('file', a_rec['file'])
              p = root / 'docs' / tag / name
              assert p.is_file(), p
              with rasterio.open(p) as s, rasterio.open('data/raw/sample_submission.tif') as t:
                  a = s.read(1)
                  assert s.count == 1 and s.dtypes == ('float32',), (s.count, s.dtypes)
                  assert s.crs == t.crs and s.shape == t.shape and s.transform == t.transform
                  assert s.nodata is None
              assert np.isfinite(a).all() and a.min() >= 0.0 and a.max() <= 1.0
              assert int((a > 0).sum()) == a_rec['positive'] == positive
              print(f'{tag} artifact OK:', p, r['status'], 'sha256', a_rec['sha256'][:16], '...')
          PY
