name: Verify scientific code and downloadable artifact
on:
  pull_request:
  push:
    branches: [main, arena/9d8260a3-gemsdoe46]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - run: python scripts/build_r10_site.py
      - name: Generated active site is reproducible
        run: git diff --exit-code -- index.html docs/index.html docs/executive-summary.html
