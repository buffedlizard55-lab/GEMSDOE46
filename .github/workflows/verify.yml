name: Verify scientific code and downloadable artifact
on:
  pull_request:
  push:
    branches: [main, arena/9d8260a3-gemsdoe46, arena/415e48b4-gemsdoe46, arena/78db1a94-gemsdoe46, arena/945df236-gemsdoe46]
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore hash-pinned inputs required by integration tests
        run: bash scripts/restore_competition_data.sh
      - name: Run the test suite
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest.log
      - name: Publish the failing test log on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 pytest.log > pytest_tail.log || true
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --body-file pytest_tail.log || true
      - run: python scripts/verify_all.py
      # build_r10_site.py, build_site.py, build_h47_site.py and build_r11_site.py are historical
      # builders: they write the same three active pages from older receipts and would overwrite
      # the active site. The active site is generated by build_r11f_site.py from registry/r11f.json.
      - name: Rebuild the active site from the current receipt
        run: python scripts/build_r11f_site.py
      - name: Regenerate the irregularities page from its registry
        run: python scripts/build_irregularities_page.py
      - name: Generated active site is reproducible
        run: git diff --exit-code -- index.html docs/index.html docs/executive-summary.html docs/irregularities.html
      - name: Format audit of the downloadable candidate
        run: python scripts/verify_r11f_candidate.py
