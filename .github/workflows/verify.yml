name: Verify scientific code and downloadable artifact
on:
  pull_request:
  push:
    branches: [main, arena/9d8260a3-gemsdoe46, arena/415e48b4-gemsdoe46, arena/78db1a94-gemsdoe46, arena/4db1b13a-gemsdoe46]
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore hash-pinned inputs required by the tests and by the R11/R12 experiments
        run: |
          bash scripts/restore_competition_data.sh
          bash scripts/restore_r10_reference.sh
          bash scripts/restore_r12_reference.sh
      - name: Run the test suite
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest.log
      - name: Publish the failing test log on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 pytest.log > pytest_tail.log || true
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --body-file pytest_tail.log || true
      - run: python scripts/verify_all.py
      # build_site.py, build_r10_site.py, build_r11_site.py and build_h47_site.py are historical
      # builders; running them would overwrite the active pages. The active site is generated by
      # build_r12_site.py from registry/r12.json.
      - run: python scripts/build_r12_site.py
      - name: Generated active site is reproducible
        run: git diff --exit-code -- index.html docs/index.html docs/executive-summary.html
      - name: Both downloadable candidate artifacts are present and range-valid
        run: |
          python - <<'PY'
          import json, pathlib, rasterio, numpy as np
          root = pathlib.Path('.')
          for tag in ('r11', 'r12'):
              r = json.loads((root / 'registry' / f'{tag}.json').read_text())
              p = root / 'docs' / tag / r['file']
              assert p.is_file(), p
              with rasterio.open(p) as s, rasterio.open('data/raw/sample_submission.tif') as t:
                  a = s.read(1)
                  assert s.count == 1 and s.dtypes == ('float32',), (s.count, s.dtypes)
                  assert s.crs == t.crs and s.shape == t.shape and s.transform == t.transform
                  assert s.nodata is None
              assert np.isfinite(a).all() and a.min() >= 0.0 and a.max() <= 1.0
              assert int((a > 0).sum()) == r['audit']['positive'] == 37654
              print(f'{tag} artifact OK:', p, r['status'], 'sha256', r['audit']['sha256'][:16], '...')
          PY
