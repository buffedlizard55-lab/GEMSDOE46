[project]
name = "gems46"
version = "46.0.0"
description = "DFA scaling-regime-break detection on the magnetic and gravity grids for the DOE GEMS Prize Challenge"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "rasterio>=1.3"]

[project.optional-dependencies]
site = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
